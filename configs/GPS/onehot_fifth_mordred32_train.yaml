out_dir: results/onehot_fifth_mordred32
accelerator: cuda
devices: 1
gpu_serial: 0
num_workers: 0
metric_best: mae_sum
metric_agg: argmin
wandb:
  use: False
  project: ZINC
dataset:
  dir: datasets_lrx
  cache_per_run: True
  cache_refresh: True
  format: PyG-ZINC
  name: subset
  task: graph
  task_type: regression
  transductive: False
  node_encoder: True
  node_encoder_name: TypeDictNode+RWSE
  node_encoder_num_types: 119
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: TypeDictEdge
  edge_encoder_num_types: 4
  edge_encoder_bn: False
  data_mask: False
posenc_RWSE:
  enable: True
  kernel:
    times_func: range(1,21)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm
train:
  mode: double
  batch_size: 8
  eval_period: 1
  ckpt_period: 10
model:
  type: OneHotEmbedGPS
  loss_fun: l1
  temperature: 0.1
  use_cosine_similarity: True
  edge_decoding: dot
  graph_pooling: add
gt:
  layer_type: GINE+Transformer
  layers: 2
  n_heads: 4
  dim_hidden: 64
  dropout: 0.1
  attn_dropout: 0.5
  layer_norm: False
  batch_norm: True
gnn:
  head: double_graph
  layers_pre_mp: 0
  layers_post_mp: 3
  dim_inner: 64
  batchnorm: True
  act: relu
  dropout: 0.0
  agg: mean
  normalize_adj: False
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1e-4
  base_lr: 0.005
  max_epoch: 150
  scheduler: cosine_with_warmup
  num_warmup_epochs: 30
property_num: 4
property_serial: 1
use_mordred_features: True
mordred_fifth_only: True
mordred_feature_dim: 32
mordred_feature_path: results/mordred_train_feedback/mordred_selected_features_32.csv
save_path: ./results/
