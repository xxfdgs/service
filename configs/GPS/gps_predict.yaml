out_dir: results
accelerator: cuda
devices: 1
gpu_serial: 0
num_workers: 0
metric_best: mae  #mae #loss
metric_agg: argmin
wandb:
  use: True
  project: ZINC
dataset:
  dir: datasets_lrx
  format: PyG-ZINC
  name: subset
  task: graph
  task_type: regression
  transductive: False
  node_encoder: True
  node_encoder_name: TypeDictNode+RWSE
  node_encoder_num_types: 119 #28
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: TypeDictEdge
  edge_encoder_num_types: 4
  edge_encoder_bn: False
  data_mask: False #True #False           ###lrx add
posenc_RWSE:
  enable: True
  kernel:
    times_func: range(1,21)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm
train:
  mode: double_predict  ####custom  #mask
  batch_size: 4 #13 #64
  eval_period: 1
  ckpt_period: 10
model:
  type: GPSDoubleModel_multi4_cat_v0 #
  loss_fun: l1   #l1 #NTX #l1_similar
  temperature: 0.1
  use_cosine_similarity: True  
  edge_decoding: dot
  graph_pooling: add
gt:
  layer_type: GINE+Transformer  # CustomGatedGCN+Performer
  layers: 2  #10
  n_heads: 4
  dim_hidden: 64  # `gt.dim_hidden` must match `gnn.dim_inner`
  dropout: 0.0
  attn_dropout: 0.5
  layer_norm: False
  batch_norm: True
gnn:
  head: double_graph #unuse  #san_graph #feat_graph #fine_graph #fine_continue_graph # multi_graph
  layers_pre_mp: 0
  layers_post_mp: 3  # Not used when `gnn.head: san_graph`
  dim_inner: 64  # `gt.dim_hidden` must match `gnn.dim_inner`
  batchnorm: True
  act: relu
  dropout: 0.0
  agg: mean
  normalize_adj: False
optim:
  clip_grad_norm: True
  optimizer: adamW # AveragedModel adamW
  weight_decay: 1e-5
  base_lr: 0.01 #0.0005
  max_epoch: 1  #300
  scheduler: cosine_with_warmup
  num_warmup_epochs: 50
pretrained:
  dir: results/fifth_component_weight2/direct_train
  freeze_main: False #True  #False
  reset_prediction_head: False #False  #True
data_rate: True # True= use rate date, False=no use rate data
data_rate_type: True # True=a+b=1 False=1x
fifth_component_delta_weight: 2.0
read_multi: False
#read_csv: 202604/20260413-DOPE-peptide-predict.csv
read_csv: feedback/20260703_validation.csv
save_path: ./results/
property_num: 4
property_serial: 1
result_out : False #True False
